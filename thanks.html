    <div class="page-hero-content container">
      <div class="eyebrow">Message Received</div>

<!-- Replaced at build time with the shared footer (scripts/shared-shell.mjs).
     The element must exist first: replaceFooter swaps an existing one and does
     nothing when a page has none.
     Avoid writing element names in angle brackets in comments on this page —
     the footer replacement and the markup checker both scan the raw HTML and
     would match the example rather than the real element. -->
