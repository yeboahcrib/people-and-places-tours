<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Every way to reach People & Places: browse Ghana experiences, plan a trip, message us on WhatsApp, or read what to know before you fly.">
<!-- Not a search-acquisition page. It duplicates links that already exist in
     the navigation, so indexing it would put a thin page in front of the
     homepage for brand searches. "follow" so the links still count. Being
     noindex also keeps it out of the generated sitemap without touching the
     sitemap or robots rules. -->
<meta name="robots" content="noindex,follow">
<title>People &amp; Places &mdash; Every Link</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#FFB81C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Standalone by design: no style.css, no script.js, no photographs. Every
     colour is copied from style.css :root with the token it came from named
     beside it. The ground is the same yellow the homepage's pathways band
     uses, and the rows are built from the same cream, charcoal and forest
     that band already puts on it. */
  :root {
    --ink:        #1A1A1A;   /* --pap-charcoal */
    --gold:       #FFB81C;   /* --pap-yellow   */
    --cream:      #FFF7E8;   /* --pap-cream    */
    --forest:     #123F35;   /* --pap-forest   */
    --terracotta: #C2553D;   /* --pap-terracotta */
    --soft-gold:  #F2D27A;   /* --pap-soft-gold  */
    --font-display: 'Archivo Black', 'Arial Black', Impact, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --gutter: 1.25rem;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--gold); }
  body {
    position: relative;
    min-height: 100svh;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    /* Warmth rather than lighting: cream lifting the top of the page, a wash
       of terracotta pooling at the foot. Both from the brand palette. */
    /* Warmth built from overlapping blooms rather than a pattern: cream
       lifting the top, soft gold opening the upper left, terracotta warming
       the lower right, and forest settling the foot. Nothing repeats, so
       there is no wallpaper to notice. */
    background:
      radial-gradient(135% 82% at 50% -14%, rgba(255,247,232,0.62), transparent 54%),
      radial-gradient(88% 58% at 8% 26%,   rgba(242,210,122,0.52), transparent 60%),
      radial-gradient(96% 64% at 96% 74%,  rgba(194,85,61,0.22),  transparent 62%),
      radial-gradient(120% 52% at 50% 112%, rgba(18,63,53,0.16),  transparent 66%),
      var(--gold);
  }

  /* --- Ground ------------------------------------------------------------
     Two layers over the blooms: a little linework, and grain. No grid, no
     tiling, nothing that repeats -- the earlier warp-and-weft read as graph
     paper the moment you noticed it. What is left is three long curves and a
     single weave motif, large and mostly off the edge, all faint enough to
     register as depth rather than as pattern. The motif stays abstract on
     purpose: the comment beside it in homepage-sections.js says named Adinkra
     symbols will only be used once their form and meaning have been reviewed,
     and a link page is not the place to jump that queue. */
  .ground { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .ground svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ink { animation: sway 120s ease-in-out infinite alternate; }
  .ink path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .ink .motif { color: var(--forest); opacity: 0.05; stroke-width: 6; }
  .ink .trail { color: var(--forest); opacity: 0.07; stroke-width: 1.6; }
  .ink .trail-warm { color: var(--terracotta); opacity: 0.09; stroke-width: 1.6; }
  /* Screen-print grain. Multiply keeps it a texture in the paper rather than
     a haze on top of it. */
  .grain { opacity: 0.1; mix-blend-mode: multiply; }
  @keyframes sway {
    from { transform: translate3d(-0.6%, -0.4%, 0); }
    to   { transform: translate3d(0.6%, 0.5%, 0); }
  }

  /* --- Shell --- */
  .hub {
    position: relative; z-index: 1;
    width: 100%; max-width: 26.5rem;
    padding: 3rem var(--gutter) 3rem;
    display: flex; flex-direction: column;
  }

  /* --- Brand ---
     The lockup is the heading. There is no second "People & Places" in text
     under it, because the wordmark already says it. */
  /* The lockup is cropped to its own ink rather than to its viewBox.
     Measured on the yellow: the artwork occupies x 10-732 of 960 and y 109-415
     of 540, so the file carries 43% dead height and sits left of centre. Left
     as-is it reads slightly off-centre with a hole beneath it. The asset is
     untouched; the crop lives here. */
  /* No auto margin here: .brand is a flex item, and `margin: 0 auto` makes a
     flex item shrink to its content -- which left the mark's percentage width
     resolving against zero. The centring belongs on .brand-mark. */
  .brand { margin: 0 0 1.15rem; line-height: 0; }
  .brand-mark {
    position: relative;
    display: block;
    width: min(268px, 72%);
    aspect-ratio: 722 / 306;
    margin: 0 auto;
    overflow: hidden;
  }
  .brand-mark img {
    position: absolute;
    width: 132.96%;      /* 960 / 722 */
    height: auto;
    left: -1.38%;        /*  10 / 722 */
    top: -35.63%;        /* 109 / 540, scaled to the cropped height */
  }
  .lede {
    text-align: center;
    color: rgba(26,26,26,0.74);
    font-size: 1rem;
    line-height: 1.55;
    max-width: 19rem;
    margin: 0 auto 2.15rem;
    text-wrap: pretty;
  }

  /* --- Rows --------------------------------------------------------------
     The hard charcoal offset read as a sticker. This is a real elevation
     instead: a hairline edge, a tight contact shadow and a wider soft one, so
     each row sits a few millimetres above the yellow rather than being
     printed twice on it. Hover raises it, pressing sets it back down on the
     surface -- the same gesture, without the cartoon. */
  .links { display: flex; flex-direction: column; gap: 0.8rem; }
  .row {
    display: flex; align-items: center; gap: 0.85rem;
    min-height: 64px; padding: 0.95rem 1.3rem;
    border: 1px solid rgba(26,26,26,0.09);
    border-radius: 18px;
    text-decoration: none;
    font-weight: 600; font-size: 1.0625rem; line-height: 1.3;
    letter-spacing: -0.005em;
    background: var(--cream); color: var(--ink);
    box-shadow: 0 1px 1px rgba(26,26,26,0.05), 0 8px 18px -10px rgba(26,26,26,0.34);
    transition: transform 240ms cubic-bezier(0.16,1,0.3,1), box-shadow 240ms cubic-bezier(0.16,1,0.3,1);
  }
  .row .label { flex: 1; }
  .row .arrow { flex-shrink: 0; opacity: 0.38; transition: transform 240ms cubic-bezier(0.16,1,0.3,1), opacity 240ms ease; }
  .row:hover, .row:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 2px 3px rgba(26,26,26,0.06), 0 16px 28px -12px rgba(26,26,26,0.4);
  }
  .row:hover .arrow, .row:focus-visible .arrow { opacity: 0.8; transform: translateX(3px); }
  .row:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(26,26,26,0.22); }

  .row-ink {
    background: var(--ink); color: var(--cream);
    border-color: rgba(255,247,232,0.08);
    box-shadow: 0 1px 1px rgba(26,26,26,0.14), 0 10px 22px -10px rgba(26,26,26,0.55);
  }
  .row-ink:hover, .row-ink:focus-visible {
    box-shadow: 0 2px 4px rgba(26,26,26,0.16), 0 18px 32px -12px rgba(26,26,26,0.62);
  }
  .row-forest {
    background: var(--forest); color: var(--cream);
    border-color: rgba(255,247,232,0.08);
    box-shadow: 0 1px 1px rgba(18,63,53,0.16), 0 10px 22px -10px rgba(18,63,53,0.6);
  }
  .row-forest:hover, .row-forest:focus-visible {
    box-shadow: 0 2px 4px rgba(18,63,53,0.18), 0 18px 32px -12px rgba(18,63,53,0.66);
  }
  .row-ink .arrow, .row-forest .arrow { opacity: 0.6; }
  .row-icon { flex-shrink: 0; }

  /* --- Social: below the travel links and lighter than them, but the same
     printed treatment so they belong to the same page. --- */
  .foot { margin-top: 2.4rem; text-align: center; }
  .social { display: flex; justify-content: center; gap: 0.85rem; margin-bottom: 1.5rem; }
  .social a {
    display: grid; place-items: center; width: 54px; height: 54px;
    border: 1px solid rgba(26,26,26,0.09); border-radius: 50%;
    background: var(--cream); color: var(--ink);
    box-shadow: 0 1px 1px rgba(26,26,26,0.05), 0 6px 14px -8px rgba(26,26,26,0.34);
    transition: transform 240ms cubic-bezier(0.16,1,0.3,1), box-shadow 240ms cubic-bezier(0.16,1,0.3,1);
  }
  .social a:hover, .social a:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 2px 3px rgba(26,26,26,0.06), 0 12px 22px -10px rgba(26,26,26,0.4);
  }
  .social a:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(26,26,26,0.22); }
  .foot p { color: rgba(26,26,26,0.66); font-size: 0.8125rem; line-height: 1.9; }
  .foot a.plain { color: var(--ink); font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(26,26,26,0.3); }
  .foot a.plain:hover, .foot a.plain:focus-visible { border-bottom-color: var(--ink); }

  a:focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; }
  .row-forest:focus-visible { outline-color: var(--ink); }

  /* --- Entrance: one pass. Fill mode is `both`, so switching the animation
     off for reduced motion leaves everything in its natural visible state. */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .brand { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both; }
  .lede  { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both 70ms; }
  .row   { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both; }
  .foot  { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both 350ms; }
  .row:nth-of-type(1) { animation-delay: 120ms; }
  .row:nth-of-type(2) { animation-delay: 165ms; }
  .row:nth-of-type(3) { animation-delay: 210ms; }
  .row:nth-of-type(4) { animation-delay: 255ms; }
  .row:nth-of-type(5) { animation-delay: 300ms; }

  @media (prefers-reduced-motion: reduce) {
    .ink { animation: none; }
    .brand, .lede, .row, .foot { animation: none; }
    .row, .row .arrow, .social a { transition: none; }
    .row:hover, .row:focus-visible, .social a:hover, .social a:focus-visible { transform: none; }
    .row:hover .arrow, .row:focus-visible .arrow { transform: none; }
  }

  /* Short phones: reaching WhatsApp should not need a second scroll. */
  @media (max-height: 720px) {
    .hub { padding-top: 2rem; padding-bottom: 2rem; }
    .brand-mark { width: min(214px, 62%); }
    .lede { font-size: 0.9375rem; margin-bottom: 1.6rem; }
    .links { gap: 0.7rem; }
    .row { min-height: 56px; }
    .foot { margin-top: 1.7rem; }
  }
  @media (max-width: 359px) {
    :root { --gutter: 0.9rem; }
    .row { padding: 0.85rem 1rem; font-size: 1rem; gap: 0.65rem; }
  }
</style>
</head>
<body>

<div class="ground" aria-hidden="true">
  <!-- Linework: three long curves and one weave motif, large and mostly off
       the edge. Sparse on purpose -- there is nothing here to read as a
       pattern. -->
  <svg class="ink" viewBox="0 0 390 860" preserveAspectRatio="xMidYMid slice" focusable="false">
    <g class="motif" transform="translate(-96 528) rotate(-8) scale(1.5)">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <path class="trail" d="M-30 232C64 150 150 268 232 214s90-142 200-104"/>
    <path class="trail-warm" d="M-24 664c96 44 138-52 224-34s124 84 214 44" opacity=".08"/>
    <path class="trail" d="M-20 418c110 8 132 94 226 92s110-64 202-40" opacity=".045"/>
  </svg>

  <!-- Paper: screen-print grain, multiplied into the yellow. -->
  <svg class="grain" focusable="false">
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#paper)"/>
  </svg>
</div>

<main class="hub">
  <h1 class="brand">
    <span class="brand-mark">
      <img src="assets/PAP LOGO_BLACK_NO BACKGROUND.svg" alt="{{businessName}}" width="1920" height="1080" fetchpriority="high" decoding="async">
    </span>
  </h1>
  <p class="lede">We create unforgettable travel experiences in Ghana.</p>

  <nav class="links" aria-label="{{businessName}} links">
    <a class="row row-ink" href="packages.html" data-go-link="experiences">
      <span class="label">Explore Experiences</span>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <a class="row row-forest" href="{{whatsappUrl}}" target="_blank" rel="noopener" data-go-link="whatsapp">
      <svg class="row-icon" width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.05 0A11.89 11.89 0 0 0 1.59 17.84L0 24l6.31-1.65A11.94 11.94 0 1 0 12.05 0zm0 21.79a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.89 9.89 0 1 1 8.38 4.63zm5.42-7.41c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15s-.77.97-.94 1.16c-.17.2-.35.22-.64.08-1.76-.88-2.92-1.57-4.09-3.58-.31-.53.31-.49.88-1.62.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-2.72 2.98-.52 7.29 3.9 9.2 1.68.72 2.95.78 4.01.65.57-.08 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35z"/></svg>
      <span class="label">WhatsApp Us</span>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <a class="row" href="just-go-ghana.html" data-go-link="just-go-ghana">
      <span class="label">Just Go Ghana</span>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <a class="row" href="contact.html?tour=custom" data-go-link="custom">
      <span class="label">Plan a Custom Trip</span>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </a>

    <a class="row" href="travel-information.html" data-go-link="travel-information">
      <span class="label">Travel Information</span>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </nav>

  <div class="foot">
    <div class="social">
      <a href="{{instagramUrl}}" target="_blank" rel="noopener" aria-label="{{businessName}} on Instagram" data-go-link="instagram">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <a href="{{tiktokUrl}}" target="_blank" rel="noopener" aria-label="{{businessName}} on TikTok" data-go-link="tiktok">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 1 1-2.09-2.78V8.73a6.34 6.34 0 1 0 6.33 6.57v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.73z"/></svg>
      </a>
    </div>
    <p>
      <a class="plain" href="{{primaryPhoneHref}}" data-site-copy="primaryPhone">{{primaryPhone}}</a><br>
      Accra, Ghana
    </p>
  </div>
</main>

</body>
</html>
