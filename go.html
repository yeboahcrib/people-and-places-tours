<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Every way to reach People & Places: browse Ghana experiences, plan a trip, message us on WhatsApp, or read what to know before you fly.">
<!-- Not a search-acquisition page. It duplicates links that already exist in
     the navigation, so indexing it would put a thin page in front of the
     homepage for brand searches. "follow" so the links still count. Being
     noindex also keeps it out of the generated sitemap without touching the
     sitemap or robots rules. -->
<meta name="robots" content="noindex,follow">
<title>People &amp; Places &mdash; Every Link</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#1A1A1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Standalone by design: no style.css, no script.js, no photographs. Every
     colour is copied from style.css :root with the token it came from named
     beside it. Dark ground, warm light: the charcoal is the site's own, and
     everything laid on it is gold, forest and cream from the same palette. */
  :root {
    --ink:        #1A1A1A;   /* --pap-charcoal */
    --gold:       #FFB81C;   /* --pap-yellow   */
    --cream:      #FFF7E8;   /* --pap-cream    */
    --forest:     #123F35;   /* --pap-forest   */
    --terracotta: #C2553D;   /* --pap-terracotta */
    --soft-gold:  #F2D27A;   /* --pap-soft-gold  */
    --forest-deep:#0B2E27;   /* --pap-forest-deep */
    --gold-deep:  #D9960A;   /* --yellow-dark     */
    /* Card fills. Solid, and warm rather than neutral, because the ground
       they sit on carries gold and terracotta. The values are what the old
       translucent rows measured at on screen, so the page keeps its colour
       and loses only the glass. They step down so the stack recedes. */
    /* Paper, stepping warmer down the stack. */
    --card-1:     #FFF8EC;
    --card-2:     #FAF1E1;
    --card-3:     #F4EAD6;
    --muted:      rgba(255,247,232,0.58);
    --hairline:   rgba(255,247,232,0.12);
    --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    --gutter: 1.25rem;
    --offset: 4px;   /* how far the printed shadow sits behind each card */
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--ink); }
  body {
    position: relative;
    min-height: 100svh;
    color: var(--cream);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    /* Base and edges only. The colour lives on its own layer below so it can
       drift; here the page just gets its charcoal and a vignette, so the
       corners fall away and the middle of the screen carries the light. */
    background:
      radial-gradient(125% 92% at 50% 46%, transparent 38%, rgba(0,0,0,0.34) 78%, rgba(0,0,0,0.52) 100%),
      var(--ink);
  }

  /* --- Ground ------------------------------------------------------------
     Woven marks, and grain. The mark is the site's own -- described in
     homepage-sections.js as "an original woven-line accent inspired by the
     rhythm of Ghanaian textiles", and explicitly not a named Adinkra symbol,
     because the note beside it says named symbols will only be used once
     their form and meaning have been reviewed. There are more of them here
     and at more sizes, but each one stays faint enough to read as depth. */
  .ground { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .ground svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Four pools, none of them centred on anything: gold high and left of
     middle, terracotta off the right edge, forest off the left, and the
     forest-deep floor pulled slightly right. The asymmetry is the point --
     centred pools read as a vignette, offset ones read as light in a room.
     Scaled up 12% so the drift never exposes an edge. */
  .pools {
    position: absolute; inset: -6%;
    background:
      radial-gradient(68% 40% at 41% 1%,   rgba(255,184,28,0.24), transparent 64%),
      radial-gradient(52% 38% at 106% 27%, rgba(194,85,61,0.22),  transparent 66%),
      radial-gradient(58% 42% at -10% 58%, rgba(18,63,53,0.78),   transparent 68%),
      radial-gradient(96% 46% at 57% 106%, rgba(11,46,39,0.92),   transparent 72%);
    animation: pools 44s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes pools {
    from { transform: translate3d(-1.4%, -1%, 0) scale(1.02); }
    to   { transform: translate3d(1.4%, 1.2%, 0) scale(1.06); }
  }
  .ink-layer { animation: sway 120s ease-in-out infinite alternate; }
  .ink-layer path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
  .m-gold  { color: var(--gold);       opacity: 0.075; stroke-width: 6; }
  .m-warm  { color: var(--terracotta); opacity: 0.14;  stroke-width: 6; }
  .m-leaf  { color: var(--soft-gold);  opacity: 0.055; stroke-width: 6; }
  .trail      { color: var(--soft-gold); opacity: 0.07; stroke-width: 1.6; }
  .trail-warm { color: var(--terracotta); opacity: 0.1; stroke-width: 1.6; }
  .grain { opacity: 0.13; mix-blend-mode: overlay; }
  @keyframes sway {
    from { transform: translate3d(-0.6%, -0.4%, 0); }
    to   { transform: translate3d(0.6%, 0.5%, 0); }
  }

  /* --- Shell --- */
  .hub {
    position: relative; z-index: 1;
    width: 100%; max-width: 26.5rem;
    padding: 2.4rem var(--gutter) 1.35rem;
    display: flex; flex-direction: column;
  }

  /* --- Brand ---
     The symbol alone, cropped to its own ink rather than its viewBox: measured
     on the charcoal, the artwork sits at x 196-430 of 640 and y 6-351 of 360,
     so two thirds of the file's width is empty. The asset is untouched; the
     crop lives here. There is no wordmark under it by choice -- the tab title
     and the image's alt text still carry the name. */
  /* A warm pool behind the mark rather than more type. It sits inside .hub's
     stacking context at z-index -1, so it lies under the symbol but still
     above the page's own layers. */
  .brand { position: relative; margin: 0 0 1.5rem; line-height: 0; }
  .brand::before {
    content: '';
    position: absolute; left: 50%; top: 48%;
    width: 17rem; height: 17rem; margin: -8.5rem 0 0 -8.5rem;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,184,28,0.17) 0%, rgba(255,184,28,0.06) 42%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }
  .brand-mark {
    position: relative; display: block;
    width: min(116px, 29%);
    aspect-ratio: 234 / 345;
    margin: 0 auto;
    overflow: hidden;
  }
  .brand-mark img {
    position: absolute;
    width: 273.5%;      /* 640 / 234 */
    height: auto;
    left: -83.76%;      /* 196 / 234 */
    top: -1.74%;        /*   6 / 360, scaled to the cropped height */
  }
  /* This is the only sentence on the page. It was sharing the footer's muted
     tone, which left the line explaining the business as quiet as the
     address under it. Brighter, larger and a little heavier -- still clearly
     beneath the symbol, but no longer hiding. */
  .lede {
    text-align: center;
    color: rgba(255,247,232,0.92);
    font-size: 1.125rem;
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: -0.005em;
    max-width: 20.5rem;
    margin: 0 auto 1.85rem;
    text-wrap: pretty;
  }

  /* --- Rows ---
     A hairline edge, a tight contact shadow and a wider soft one, so each row
     sits above the ground rather than being drawn onto it. Hover raises it;
     pressing sets it back down. */
  .links { display: flex; flex-direction: column; gap: 0.75rem; }
  /* Solid surfaces, not panes. No backdrop blur, no specular sweep and no
     white inset along the top -- those three together are what read as glass.
     What is left is a matte fill with a barely-there gradient, a restrained
     border, a whisper of an edge highlight, and a real shadow underneath, so
     each card sits on the page rather than hovering over it. */
  .row {
    display: flex; align-items: center; gap: 0.85rem;
    min-height: 64px; padding: 0.95rem 1.3rem;
    border: 2px solid var(--ink);
    border-radius: 16px;
    text-decoration: none;
    font-weight: 600; font-size: 1.0625rem; line-height: 1.3;
    letter-spacing: -0.005em;
    color: var(--ink);
    background: var(--card-1);
    box-shadow: var(--offset) var(--offset) 0 #000;
    transition: transform 150ms cubic-bezier(0.16,1,0.3,1), box-shadow 150ms cubic-bezier(0.16,1,0.3,1),
                background-color 150ms ease;
  }
  .row .label { flex: 1; }
  .row .arrow {
    flex-shrink: 0;
    opacity: 0.34;
    transition: transform 220ms cubic-bezier(0.16,1,0.3,1), opacity 220ms ease;
  }
  .row:hover, .row:focus-visible { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #000; }
  .row:hover .arrow, .row:focus-visible .arrow { opacity: 0.85; transform: translateX(3px); }
  /* Pressed: the card moves onto its own shadow and the shadow disappears. */
  .row:active { transform: translate(var(--offset), var(--offset)); box-shadow: 0 0 0 #000; }

  .row-n1 { background: var(--card-1); }
  .row-n2 { background: var(--card-2); }
  .row-n3 { background: var(--card-3); }
  .row-n1:hover, .row-n1:focus-visible { background: #FFFDF6; }
  .row-n2:hover, .row-n2:focus-visible { background: #FFF7EA; }
  .row-n3:hover, .row-n3:focus-visible { background: #FAF1DF; }

  /* Matte, not lacquered. A two-stop gradient of about eight percent does the
     work a three-stop one with a white inset was doing before -- enough to
     stop the fill reading as flat, not enough to look wet. Both stay centred
     on the brand colour, with the palette's own deeper tone underneath. */
  .row-gold { background: var(--gold); }
  .row-gold:hover, .row-gold:focus-visible { background: #FFC53D; }
  .row-forest { background: var(--forest); color: var(--cream); }
  .row-forest:hover, .row-forest:focus-visible { background: #164A3E; }
  .row-gold .arrow { opacity: 0.55; }
  .row-forest .arrow { opacity: 0.6; }
  /* The leading mark. Monoline at the chevron's weight, so both ends of a row
     belong to one drawing rather than two icon sets. */
  .row-icon { flex-shrink: 0; opacity: 0.9; }

  /* --- Social --- */
  .foot { margin-top: 1.85rem; text-align: center; }
  .social { display: flex; justify-content: center; gap: 0.85rem; margin-bottom: 1.5rem; }
  .social a {
    display: grid; place-items: center; width: 54px; height: 54px;
    border: 2px solid var(--ink); border-radius: 50%;
    background: var(--card-1); color: var(--ink);
    box-shadow: 3px 3px 0 #000;
    transition: transform 150ms cubic-bezier(0.16,1,0.3,1), box-shadow 150ms cubic-bezier(0.16,1,0.3,1),
                background-color 150ms ease;
  }
  .social a:hover, .social a:focus-visible { transform: translate(-2px,-2px); background: #FFFDF6; box-shadow: 5px 5px 0 #000; }
  .social a:active { transform: translate(3px,3px); box-shadow: 0 0 0 #000; }
  .foot p { color: var(--muted); font-size: 0.8125rem; line-height: 1.9; }
  .foot a.plain { color: rgba(255,247,232,0.9); font-weight: 600; text-decoration: none; border-bottom: 1px solid rgba(255,247,232,0.28); }
  .foot a.plain:hover, .foot a.plain:focus-visible { color: var(--gold); border-bottom-color: var(--gold); }

  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .row-gold:focus-visible { outline-color: var(--cream); }

  /* --- Entrance: one pass. Fill mode is `both`, so switching the animation
     off for reduced motion leaves everything in its natural visible state. */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .brand { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both; }
  .lede  { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both 70ms; }
  .row   { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both; }
  .foot  { animation: rise 520ms cubic-bezier(0.16,1,0.3,1) both 350ms; }
  .row:nth-of-type(1) { animation-delay: 120ms; }
  .row:nth-of-type(2) { animation-delay: 165ms; }
  .row:nth-of-type(3) { animation-delay: 210ms; }
  .row:nth-of-type(4) { animation-delay: 255ms; }
  .row:nth-of-type(5) { animation-delay: 300ms; }

  @media (prefers-reduced-motion: reduce) {
    .ink-layer, .pools { animation: none; }
    .brand, .lede, .row, .foot { animation: none; }
    .row, .row .arrow, .social a { transition: none; }
    .row:hover, .row:focus-visible, .social a:hover, .social a:focus-visible { transform: none; }
    .row:hover .arrow, .row:focus-visible .arrow { transform: none; }
  }

  /* Short phones: reaching WhatsApp should not need a second scroll. */
  @media (max-height: 720px) {
    .hub { padding-top: 2.1rem; padding-bottom: 2rem; }
    .brand { margin-bottom: 1rem; }
    .brand-mark { width: min(84px, 23%); }
    .lede { font-size: 1.0625rem; margin-bottom: 1.7rem; }
    .links { gap: 0.65rem; }
    .row { min-height: 56px; }
    .foot { margin-top: 1.7rem; }
  }
  @media (max-width: 359px) {
    :root { --gutter: 0.9rem; --offset: 3px; }
    .row { padding: 0.85rem 1.05rem; font-size: 1rem; gap: 0.65rem; }
  }
</style>
</head>
<body>

<div class="ground" aria-hidden="true">
  <div class="pools"></div>
  <!-- The site's own woven-line mark, at eight sizes across the page. Faint
       enough that none of them competes with a link. -->

    <g class="m-gold" transform="translate(-78 40) rotate(-12) scale(1.2)">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <g class="m-warm" transform="translate(296 118) rotate(14) scale(0.62)">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <g class="m-leaf" transform="translate(318 336) rotate(-8) scale(1.05)">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <g class="m-gold" transform="translate(-56 392) rotate(9) scale(0.78)" opacity=".05">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <g class="m-warm" transform="translate(268 620) rotate(-14) scale(0.9)" opacity=".09">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <g class="m-gold" transform="translate(24 700) rotate(18) scale(0.52)" opacity=".06">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <g class="m-leaf" transform="translate(-40 806) rotate(-6) scale(0.86)" opacity=".05">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <g class="m-gold" transform="translate(300 796) rotate(7) scale(0.44)" opacity=".05">
    <path d="M18 50 50 18l32 32-32 32L18 50Zm60 60 32-32 32 32-32 32-32-32Z"/>
    <path d="m50 38 12 12-12 12-12-12 12-12Zm60 60 12 12-12 12-12-12 12-12Z"/>
    <path d="M66 66h28v28H66z"/>
    </g>
    <path class="trail" d="M-30 244C64 162 150 280 232 226s90-142 200-104"/>
    <path class="trail-warm" d="M-24 672c96 44 138-52 224-34s124 84 214 44" opacity=".08"/>
    <path class="trail" d="M-20 452c110 8 132 94 226 92s110-64 202-40" opacity=".045"/>
  </svg>

  <!-- Grain, laid over the dark so it reads as surface rather than haze. -->
  <svg class="grain" focusable="false">
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect width="100%" height="100%" filter="url(#paper)"/>
  </svg>
</div>

<main class="hub">

    <span class="brand-mark">

  <div class="foot">
    <div class="social">
      <a href="{{instagramUrl}}" target="_blank" rel="noopener" aria-label="{{businessName}} on Instagram" data-go-link="instagram">
