<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Horizon Trails</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script src="assets/js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="index.html">Horizon Trails</a>
        <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">
          Menu
        </button>
        <nav id="site-nav" class="site-nav">
          <a href="index.html">Home</a>
          <a href="trips.html">Trips</a>
          <a href="about.html">About</a>
          <a href="contact.html" class="active">Contact</a>
          <a href="faq.html">FAQ</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="page-hero">
        <div class="container narrow">
          <p class="eyebrow">Contact</p>
          <h1>Give travelers a place to ask before they commit.</h1>
          <p>
            Keep this page simple at first. A polished inquiry form plus your main contact channels
            is enough for the MVP.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container form-shell">
          <form class="contact-form">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" />

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" />

            <label for="trip">Trip of Interest</label>
            <input id="trip" name="trip" type="text" placeholder="Morocco Desert & Coast" />

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell us what you're looking for"></textarea>

            <button class="button" type="submit">Send Inquiry</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>Horizon Trails</p>
        <div>
          <a href="trips.html">Trips</a>
          <a href="faq.html">FAQ</a>
        </div>
      </div>
    </footer>
  </body>
</html>
