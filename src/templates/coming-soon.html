<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Deliberately not indexable. This page stands in front of a finished site
     while photography is finished, and a placeholder in the index is harder to
     recover from than a gap. Removing COMING_SOON restores the real site. -->
<meta name="robots" content="noindex, nofollow">
<title>People &amp; Places Tours — Ghana</title>
<meta name="description" content="People &amp; Places Tours. Ghana-founded, Ghana-led. Get in touch by phone, WhatsApp or email.">
<link rel="icon" href="{{FAVICON}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#FFB81C; --ink:#1A1A1A; --paper:#FBFAF6; --muted:rgba(255,255,255,0.62); }
  *,*::before,*::after { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; background:var(--ink); color:#fff;
    font-family:'Outfit',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
    /* The kente band from the site, reduced to a single quiet gesture. */
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 18px);
  }
  main { width:100%; max-width:34rem; text-align:center; }
  .logo { width:clamp(9rem,34vw,13rem); height:auto; margin:0 auto 2.5rem; display:block; }
  h1 {
    font-family:'Archivo Black',sans-serif; font-weight:400;
    font-size:clamp(1.75rem,6vw,2.6rem); line-height:1.06; letter-spacing:-0.02em;
    margin:0 0 1rem; text-wrap:balance;
  }
  .lede { font-size:clamp(1rem,2.6vw,1.125rem); line-height:1.6; color:var(--muted); margin:0 auto 2.5rem; max-width:26rem; text-wrap:pretty; }
  .rule { width:56px; height:2px; background:var(--gold); border:0; margin:0 auto 2.25rem; }
  .contact { display:flex; flex-direction:column; gap:0.75rem; align-items:center; }
  .contact a {
    display:inline-flex; align-items:center; justify-content:center; gap:0.55rem;
    min-height:48px; padding:0.75rem 1.5rem; border-radius:999px;
    font-size:0.9375rem; letter-spacing:0.02em; text-decoration:none;
    transition:transform 200ms ease, background 200ms ease, border-color 200ms ease;
  }
  .primary { background:var(--gold); color:var(--ink); font-weight:500; }
  .primary:hover { transform:translateY(-2px); }
  .ghost { color:#fff; border:1px solid rgba(255,255,255,0.24); }
  .ghost:hover { border-color:var(--gold); color:var(--gold); }
  .meta { margin:2.5rem 0 0; font-size:0.8125rem; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,0.42); }
  svg.ico { width:18px; height:18px; flex:0 0 18px; }
  @media (min-width:30rem) { .contact { flex-direction:row; flex-wrap:wrap; justify-content:center; } }
  @media (prefers-reduced-motion:reduce) { .contact a { transition:none; } .primary:hover { transform:none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="{{LOGO}}" alt="People &amp; Places" width="208" height="88">
  <h1>Something new is coming.</h1>
  <p class="lede">Ghana-founded, Ghana-led. Hosted by people who grew up here. Our new site is nearly ready &mdash; reach us any time in the meantime.</p>
  <hr class="rule">
  <div class="contact">
    <a class="primary" href="{{WHATSAPP}}">
      <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.7 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4-.1-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1.1 2.8 1.2 3c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
      WhatsApp us
    </a>
    <a class="ghost" href="tel:{{PHONE_HREF}}">{{PHONE}}</a>
    <a class="ghost" href="mailto:{{EMAIL}}">{{EMAIL}}</a>
  </div>
  <p class="meta">{{SERVICE_AREA}}</p>
</main>
</body>
</html>
