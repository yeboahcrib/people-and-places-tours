<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Internal tool. Never indexed, never linked from the site, and behind
       Cloudflare Access on top of all three. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>Enquiries | People &amp; Places Tours</title>
  <meta name="description" content="Internal enquiry figures for People &amp; Places Tours." />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body class="dash-body">
  <header class="dash-bar">
    <div class="dash-bar-inner">
      <span class="dash-mark"><img src="assets/favicon.svg" alt="" width="26" height="26" />People &amp; Places</span>
      <span class="dash-bar-label">Internal · Enquiries</span>
      <span class="dash-stamp" data-dash-stamp></span>
    </div>
  </header>

  <main class="dash" id="main-content">
    <div class="dash-inner">
      <div class="dash-heading">
        <h1>Enquiry dashboard</h1>
        <p class="dash-scope" data-dash-scope aria-live="polite">Reading the figures…</p>
      </div>

      <form class="dash-filters" data-dash-filters aria-label="Filter enquiries" hidden>
        <div class="dash-field">
          <label for="dash-range">Dates</label>
          <select id="dash-range" name="range"></select>
        </div>
        <div class="dash-dates" data-dash-dates hidden>
          <div class="dash-field">
            <label for="dash-from">From</label>
            <input type="date" id="dash-from" name="from" />
          </div>
          <div class="dash-field">
            <label for="dash-to">To</label>
            <input type="date" id="dash-to" name="to" />
          </div>
        </div>
        <div class="dash-field">
          <label for="dash-country">Country</label>
          <select id="dash-country" name="country"><option value="">All countries</option></select>
        </div>
        <div class="dash-field">
          <label for="dash-experience">Experience</label>
          <select id="dash-experience" name="experience"><option value="">All experiences</option></select>
        </div>
        <button type="button" class="dash-clear" data-dash-clear hidden>Clear filters</button>
      </form>

      <div class="dash-root" data-dash-root aria-busy="true">
        <div class="dash-message"><h2>Reading the figures…</h2><p>One moment.</p></div>
      </div>
    </div>
  </main>

  <dialog class="dash-drawer" data-dash-drawer aria-labelledby="dash-drawer-title">
    <div class="dash-drawer-head">
      <div class="dash-drawer-heading">
        <p class="dash-drawer-eyebrow">Enquiry</p>
        <h2 id="dash-drawer-title" data-drawer-title>Enquiry</h2>
      </div>
      <button type="button" class="dash-drawer-close" data-drawer-close aria-label="Close enquiry">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <div class="dash-drawer-body" data-drawer-body></div>
  </dialog>

  <div class="dash-tip" data-dash-tip role="tooltip" hidden></div>
  <script src="dashboard.js"></script>
</body>
</html>
